<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账单核查 · Bill Agent</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><div class="brand-group"><a class="brand" href="/">账单核查</a><span class="muted">本地演示</span></div><div class="header-actions"><button id="demo" class="secondary" title="使用合成数据回放，不调用模型或外部 OCR">合成演示</button><label id="drop" class="primary upload" for="file"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5" stroke="currentColor" stroke-width="1.6"/></svg>上传账单</label><input id="file" class="sr-only" type="file" accept=".pdf,.eml,.png,.jpg,.jpeg,.tif,.tiff,.xls,.xlsx,.doc,.docx,.txt"></div></header>
<main>
<form id="upload-form" class="toolbar"><label for="entity">当前记账主体</label><input id="entity" maxlength="200" placeholder="填写实际公司名称" required><label for="mode">处理方式</label><select id="mode"><option value="local">本地处理</option><option value="remote" disabled>指定 OCR（未配置）</option></select><button class="primary" id="submit" type="submit">开始提取</button><span id="run-state" class="run-state" aria-live="polite">等待上传</span></form>
<div class="helper"><span id="file-name">未选择文件</span><span id="mode-note">需要本机 Ollama · 文件仅在本机处理 · 单文件不超过 30 MB</span></div><label id="consent-wrap" class="consent" hidden><input id="consent" type="checkbox">允许通过临时公网 URL 提供本次 PDF，供指定 OCR 读取</label><p id="message" role="status" aria-live="polite"></p>
<section id="empty" class="empty"><h2>上传一份账单，开始核查</h2><p>或选择“合成演示”查看流程，无需启动模型。</p></section>
<div id="result-area" hidden>
<section class="document-bar"><div class="document-info"><svg width="23" height="28" viewBox="0 0 23 28" fill="none" aria-hidden="true"><path d="M3 1h11l6 6v19H3zM14 1v7h6M7 14h9M7 19h9" stroke="currentColor" stroke-width="1.5"/></svg><div><h1 id="document-name"></h1><span id="document-meta"></span></div></div><div class="document-actions"><span class="summary"><b id="count">0</b> 笔费用 · <b id="pending">0</b> 笔待复核 · <b id="evidence-count">0</b> 条证据</span><button id="download" class="secondary">下载 JSON</button></div></section>
<div id="notice" class="notice" hidden></div>
<div class="workspace"><section class="fee-pane"><div class="pane-heading"><h2>费用明细</h2><div class="filters" role="group" aria-label="费用筛选"><button id="filter-all" class="filter active" aria-pressed="true">全部 <span id="filter-all-count">0</span></button><button id="filter-review" class="filter" aria-pressed="false">待复核 <span id="filter-review-count">0</span></button></div></div><div class="table-wrap" tabindex="0" aria-label="费用表格"><table><thead><tr><th>费用名称</th><th class="numeric">金额</th><th>币种</th><th>状态</th></tr></thead><tbody id="fees"></tbody></table><p id="no-fees" class="blank" hidden>没有待复核费用。</p></div></section>
<section class="detail-pane"><div class="pane-heading"><h2>核查详情</h2><span id="selected-index"></span></div><div class="tabs" role="tablist" aria-label="核查内容"><button role="tab" aria-selected="true" aria-controls="detail" data-tab="evidence" id="tab-evidence" class="active">原文证据</button><button role="tab" aria-selected="false" aria-controls="detail" data-tab="fields" id="tab-fields">业务字段</button><button role="tab" aria-selected="false" aria-controls="detail" data-tab="json" id="tab-json">原始 JSON</button></div><div id="review-reasons" class="review-reasons" hidden></div><div id="detail" tabindex="0" role="tabpanel" aria-labelledby="tab-evidence"><p class="blank">选择一笔费用查看详情。</p></div><div class="exports"><button id="download-evidence" class="text-button">下载证据</button><button id="show-report" class="text-button">查看运行报告</button><button id="download-report" class="text-button">下载运行报告</button></div></section></div>
</div>
</main><dialog id="report-panel" class="report-dialog" aria-labelledby="report-title"><div class="dialog-heading"><h2 id="report-title">运行报告与解析提示</h2><button id="close-report" class="secondary">关闭</button></div><pre id="report" tabindex="0"></pre></dialog><footer><span>文件与日志仅保存在本机 outputs/web-demo。</span><span>候选结果不代表已记账</span></footer>
</body></html>
